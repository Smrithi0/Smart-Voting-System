<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Register</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
    width:420px;
    padding:35px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    color:white;
    text-align:center;
}

h2{
    margin-bottom:25px;
    font-weight:600;
}

form{
    display:flex;
    flex-direction:column;
}

/* INPUTS */

input[type="text"],
input[type="password"],
input[type="email"]{

    width:100%;
    padding:12px;
    margin:10px 0;

    border:none;
    outline:none;

    border-radius:10px;

    background:rgba(255,255,255,0.1);

    color:white;
    font-size:15px;
}

input::placeholder{
    color:rgba(255,255,255,0.6);
}

/* LABEL */

label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:5px;
    margin-bottom:10px;

    font-size:14px;
    color:#e2e8f0;
}

label input[type="checkbox"]{
    width:auto;
    margin:0;
}

/* BUTTON */

button{

    width:100%;
    padding:12px;

    margin-top:10px;

    border:none;
    border-radius:10px;

    background:linear-gradient(45deg,#6366f1,#8b5cf6);

    color:white;
    font-size:15px;
    font-weight:600;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

/* LINK */

a{
    display:block;
    margin-top:18px;

    color:#38bdf8;
    text-decoration:none;
    font-size:14px;
}

a:hover{
    text-decoration:underline;
}

/* MESSAGE */

#msg{
    margin-top:12px;
    font-size:14px;
    color:#ff6b6b;
}

.success{
    color:#4ade80;
}

.error{
    color:#ff6b6b;
}

</style>

</head>

<body>

<div class="container">

<h2>Register</h2>

<form id="registerForm">

<input
type="text"
name="name"
placeholder="Name"
required>

<input
type="text"
name="phone"
placeholder="Phone"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="password"
id="p1"
name="password"
placeholder="Password"
required>

<input
type="password"
id="p2"
placeholder="Confirm Password"
required>

<label>

<input
type="checkbox"
onclick="togglePasswords()">

Show Passwords

</label>

<button type="submit">
Register
</button>

</form>

<a href="login.html">
Already have an account? Login
</a>

<p id="msg"></p>

</div>

<script>

/* SHOW PASSWORDS */

function togglePasswords(){

    let p1 =
        document.getElementById("p1");

    let p2 =
        document.getElementById("p2");

    if(p1.type === "password"){

        p1.type = "text";
        p2.type = "text";

    }else{

        p1.type = "password";
        p2.type = "password";
    }
}

/* REGISTER */

document.getElementById("registerForm").onsubmit =
async function(e){

    e.preventDefault();

    let p1 =
        document.getElementById("p1").value;

    let p2 =
        document.getElementById("p2").value;

    if(p1 !== p2){

        document.getElementById("msg")
            .innerHTML =
            `<span class="error">
                Passwords do not match
            </span>`;

        return;
    }

    let res = await fetch("/register",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:new URLSearchParams(
            new FormData(this)
        )
    });

    if(res.redirected){

        window.location.href = res.url;
        return;
    }

    let text =
        await res.text();

    if(text === "EMAIL_ALREADY_EXISTS"){

        document.getElementById("msg")
            .innerHTML =
            `<span class="error">
                Email already exists
            </span>`;
    }

    else if(text.includes("Password must")){

        document.getElementById("msg")
            .innerHTML =
            `<span class="error">
                ${text}
            </span>`;
    }

    else{

        document.getElementById("msg")
            .innerHTML =
            `<span class="success">
                ${text}
            </span>`;
    }
};

</script>

</body>
</html>
