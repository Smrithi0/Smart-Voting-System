<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Login</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
    width:400px;
    padding:35px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
    color:white;
    text-align:center;
}

h2{
    margin-bottom:25px;
    font-weight:600;
}

form{
    display:flex;
    flex-direction:column;
}

/* INPUTS */

input[type="text"],
input[type="password"],
input[type="email"]{

    width:100%;
    padding:12px;
    margin:10px 0;

    border:none;
    outline:none;

    border-radius:10px;

    background:rgba(255,255,255,0.1);

    color:white;
    font-size:15px;
}

input::placeholder{
    color:rgba(255,255,255,0.6);
}

/* SHOW PASSWORD */

label{
    display:flex;
    align-items:center;
    gap:8px;

    margin-top:5px;
    margin-bottom:15px;

    font-size:14px;
    color:#e2e8f0;
}

label input[type="checkbox"]{
    width:auto;
    margin:0;
}

/* BUTTON */

button{

    width:100%;
    padding:12px;

    border:none;
    border-radius:10px;

    background:linear-gradient(45deg,#6366f1,#8b5cf6);

    color:white;
    font-size:15px;
    font-weight:600;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

/* LINKS */

a{
    display:block;
    margin-top:15px;

    color:#38bdf8;
    text-decoration:none;

    font-size:14px;
}

a:hover{
    text-decoration:underline;
}

/* ERROR */

#error{
    margin-top:12px;
    color:#ff6b6b;
    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

    <h2>Login</h2>

    <form id="form">

        <input
        type="text"
        name="name"
        placeholder="Name"
        required>

        <input
        type="text"
        name="login"
        placeholder="Phone or Email"
        required>

        <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required>

        <label>

            <input
            type="checkbox"
            onclick="togglePassword()">

            Show Password

        </label>

        <button type="submit">
            Login
        </button>

        <p id="error"></p>

    </form>

    <a href="register.html">
        Register
    </a>

    <a href="forgot.html">
        Forgot Password?
    </a>

</div>

<script>

function togglePassword(){

    let pwd =
        document.getElementById("password");

    if(pwd.type === "password"){

        pwd.type = "text";

    }else{

        pwd.type = "password";
    }
}

document.getElementById("form").onsubmit =
async function(e){

    e.preventDefault();

    let res = await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },

        body:new URLSearchParams(
            new FormData(this)
        )
    });

    if(res.redirected){

        window.location.href = res.url;
        return;
    }

    let text = await res.text();

    if(text === "WRONG_PASSWORD"){

        document.getElementById("error")
            .innerText = "Wrong Password";
    }

    else if(text === "USER_NOT_FOUND"){

        document.getElementById("error")
            .innerText = "User Not Found";
    }

    else{

        document.getElementById("error")
            .innerText = text;
    }
};

</script>

</body>
</html>
